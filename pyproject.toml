[build-system]
requires = [
  "setuptools>=77.0.3",
  "wheel",
  "numpy"
]
build-backend = "setuptools.build_meta"
dependencies = [
  "numpy",
]
[project]
name = "classtrees"
version = "1.1.0"
requires-python = ">=3.10"
authors = [
  {name = "Jakub Sawicki"}
]
description = "Python package implementing classification trees."
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["tree", "classification", "samples", "machine learning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]
[project.optional-dependencies]
test = [
    "pytest",
    "pytest-timeout",
    "numpy",
    "scikit-learn",
]
